<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuCaptain | Complete Automated Trading Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/assets/index-B0HjfDHQ.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Dnn0tatC.css">
    <script>
      // Universal High-Reliability APK Downloader
      window.downloadApk = function() {
        var apkUrl = '/QuCaptain.apk';
        
        var toast = document.getElementById('qx-apk-toast');
        if (!toast) {
          toast = document.createElement('div');
          toast.id = 'qx-apk-toast';
          toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#059669,#10b981);color:#fff;padding:12px 24px;border-radius:14px;font-weight:bold;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,0.5),0 0 20px rgba(16,185,129,0.4);z-index:999999;display:flex;align-items:center;gap:10px;animation:fadeIn 0.3s ease;';
          toast.innerHTML = '<span style="font-size:18px;">⬇️</span> Starting QuCaptain APK Download...';
          document.body.appendChild(toast);
        } else {
          toast.style.display = 'flex';
        }
        setTimeout(function() {
          if (toast && toast.parentNode) toast.style.display = 'none';
        }, 4000);

        var a = document.createElement('a');
        a.href = apkUrl;
        a.setAttribute('download', 'QuCaptain.apk');
        a.setAttribute('data-direct-download', 'true');
        document.body.appendChild(a);
        a.click();
        setTimeout(function() {
          if (document.body.contains(a)) document.body.removeChild(a);
        }, 300);
      };

      // Global click handler: Triggers APK download on download actions
      document.addEventListener('click', function(e) {
        var el = e.target.closest('button, a, [role="button"]');
        if (!el) return;
        if (el.getAttribute('data-direct-download') === 'true') return;

        var href = el.getAttribute('href') || '';
        if (href.indexOf('t.me') !== -1 || href.startsWith('mailto:') || href.startsWith('tel:')) {
          return;
        }

        var txt = (el.innerText || el.textContent || '').trim().toLowerCase();
        var isDownloadAction = (
          txt.includes('start now') ||
          txt.includes('start auto trade') ||
          txt.includes('start auto') ||
          txt.includes('download app now') ||
          txt.includes('download app') ||
          txt.includes('download apk') ||
          txt.includes('download') ||
          txt.includes('start free trial') ||
          txt.includes('start trial') ||
          txt.includes('full access free trial') ||
          txt.includes('free trial') ||
          txt.includes('start trading') ||
          txt.includes('get started free') ||
          txt.includes('install app') ||
          href.endsWith('.apk') ||
          el.getAttribute('data-action') === 'download'
        );

        if (isDownloadAction) {
          e.preventDefault();
          window.downloadApk();
        }
      }, true);
    </script>
    <script>
      // Smooth scroll for anchor links
      (function() {
        document.addEventListener('click', function(e) {
          var link = e.target.closest('a[href^="#"]');
          if (link) {
            e.preventDefault();
            var id = link.getAttribute('href').slice(1);
            if (id) {
              var el = document.getElementById(id);
              if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'start' });
              }
            }
          }
        });
        // Handle initial hash
        if (window.location.hash) {
          setTimeout(function() {
            var el = document.getElementById(window.location.hash.slice(1));
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 500);
        }
      })();
    </script>
  </head>
  <body class="bg-dark-900 text-slate-100 font-sans antialiased selection:bg-brand-cyan/30 selection:text-brand-cyan min-h-screen">
    <div id="root"></div>
  </body>
</html>
